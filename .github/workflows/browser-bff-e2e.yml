name: Browser BFF SSE Gate

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/browser-bff-e2e.yml"
      - "compose.bff-e2e.yml"
      - "compose.production.yml"
      - "frontend/**"
      - "scripts/validate_deployment.py"
      - "tests/test_deployment_baseline.py"
  pull_request:
    paths:
      - ".github/workflows/browser-bff-e2e.yml"
      - "compose.bff-e2e.yml"
      - "compose.production.yml"
      - "frontend/**"
      - "scripts/validate_deployment.py"
      - "tests/test_deployment_baseline.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-bff-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  same-origin-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BFF_E2E_PROJECT: polyuquest-bff-${{ github.run_id }}-${{ github.run_attempt }}
      BFF_E2E_ALLOWED_ORIGIN: http://127.0.0.1:13000
      BFF_E2E_BASE_URL: http://127.0.0.1:13000
      BFF_E2E_UPSTREAM_URL: http://127.0.0.1:13001
      BFF_E2E_OUTPUT: frontend/artifacts/bff-e2e/report.json
      BFF_E2E_SECRET_MARKER: bff-e2e-secret-

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install and validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm exec tsc -- --noEmit --incremental false
          npm run build

      - name: Create ephemeral BFF reader secret
        run: |
          secret_file="$RUNNER_TEMP/bff-reader-key"
          umask 077
          printf '%s%s\n' "$BFF_E2E_SECRET_MARKER" "$(openssl rand -hex 24)" > "$secret_file"
          secret_hash="$(sha256sum "$secret_file" | cut -d ' ' -f 1)"
          # Compose file secrets are bind mounts and retain host ownership/mode.
          # Keep the key unavailable to other users while allowing gid 10001 in
          # the non-root frontend container to read it.
          sudo chown root:10001 "$secret_file"
          sudo chmod 0440 "$secret_file"
          echo "BFF_E2E_SECRET_FILE=$secret_file" >> "$GITHUB_ENV"
          echo "BFF_E2E_EXPECTED_KEY_SHA256=$secret_hash" >> "$GITHUB_ENV"

      - name: Validate BFF Compose contract
        run: docker compose -f compose.bff-e2e.yml config --quiet

      - name: Start production frontend and controlled upstream
        run: >-
          docker compose -f compose.bff-e2e.yml
          -p "$BFF_E2E_PROJECT" up -d --build

      - name: Execute same-origin BFF scenario
        run: node frontend/scripts/bff-e2e-driver.mjs

      - name: Collect BFF Compose logs
        if: always()
        run: |
          mkdir -p frontend/artifacts/bff-e2e
          docker compose -f compose.bff-e2e.yml -p "$BFF_E2E_PROJECT" logs --no-color \
            > frontend/artifacts/bff-e2e/compose.log 2>&1 || true

      - name: Remove isolated BFF project
        if: always()
        run: >-
          docker compose -f compose.bff-e2e.yml
          -p "$BFF_E2E_PROJECT" down -v --remove-orphans

      - name: Remove ephemeral BFF reader secret
        if: always()
        run: |
          case "${BFF_E2E_SECRET_FILE:-}" in
            "$RUNNER_TEMP"/*) sudo rm -f -- "$BFF_E2E_SECRET_FILE" ;;
            "") ;;
            *) echo "refusing to remove secret outside RUNNER_TEMP" >&2; exit 1 ;;
          esac

      - name: Upload BFF E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-bff-e2e-${{ github.sha }}
          path: |
            frontend/artifacts/bff-e2e/report.json
            frontend/artifacts/bff-e2e/compose.log
          if-no-files-found: error
          retention-days: 14
