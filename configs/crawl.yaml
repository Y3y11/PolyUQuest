# ── Fetcher backend ────────────────────────────────────────────────
# httpx             — fast, no JS rendering (original)
# firecrawl-scrape  — our BFS + Firecrawl per-page (JS rendered)
# firecrawl-crawl   — server-side crawl (recommended, fastest)
# firecrawl-map     — URL discovery only (no content)
