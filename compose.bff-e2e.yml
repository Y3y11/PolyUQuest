services:
  frontend:
    image: ${BFF_E2E_FRONTEND_IMAGE:-polyuquest-bff-e2e:local}
    build:
      context: frontend
      dockerfile: Dockerfile
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      BACKEND_API_URL: http://upstream:18081/api
      BFF_BACKEND_API_KEY_FILE: /run/secrets/bff_backend_api_key
      BFF_IDENTITY_MODE: signed_jwt
      BFF_GATEWAY_IDENTITY_SECRET_FILE: /run/secrets/gateway_identity_secret
      BFF_INTERNAL_IDENTITY_SECRET_FILE: /run/secrets/internal_identity_secret
      BFF_ALLOWED_ORIGINS: ${BFF_E2E_ALLOWED_ORIGIN:-http://127.0.0.1:13000}
      BFF_MAX_REQUEST_BYTES: "65536"
      BFF_UPSTREAM_TIMEOUT_SECONDS: "10"
    secrets:
      - bff_backend_api_key
      - gateway_identity_secret
      - internal_identity_secret
    ports:
      - "127.0.0.1:${BFF_E2E_FRONTEND_PORT:-13000}:3000"
    networks:
      - bff_frontend
      - bff_backend
    depends_on:
      - upstream

  upstream:
    image: node:22.20.0-alpine
    init: true
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["node", "/e2e/bff-e2e-upstream.mjs"]
    environment:
      BFF_E2E_UPSTREAM_PORT: "18081"
      BFF_E2E_EXPECTED_KEY_SHA256: ${BFF_E2E_EXPECTED_KEY_SHA256:?set key digest}
      BFF_E2E_INTERNAL_IDENTITY_SECRET_FILE: /run/secrets/internal_identity_secret
    secrets:
      - internal_identity_secret
    volumes:
      - ./frontend/scripts/bff-e2e-upstream.mjs:/e2e/bff-e2e-upstream.mjs:ro
    ports:
      - "127.0.0.1:${BFF_E2E_UPSTREAM_PORT:-13001}:18081"
    networks:
      - bff_backend
      - bff_control

networks:
  bff_frontend:
  bff_backend:
    internal: true
  bff_control:

secrets:
  bff_backend_api_key:
    file: ${BFF_E2E_SECRET_FILE:?set BFF_E2E_SECRET_FILE}
  gateway_identity_secret:
    file: ${BFF_E2E_GATEWAY_IDENTITY_SECRET_FILE:?set BFF_E2E_GATEWAY_IDENTITY_SECRET_FILE}
  internal_identity_secret:
    file: ${BFF_E2E_INTERNAL_IDENTITY_SECRET_FILE:?set BFF_E2E_INTERNAL_IDENTITY_SECRET_FILE}
