services:
  neo4j:
    image: neo4j:5.26.28
    container_name: agentrag-neo4j
    ports:
      - "127.0.0.1:7474:7474"   # browser, local development only
      - "127.0.0.1:7687:7687"   # bolt, local development only
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-agent_rag_polyu}
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: agentrag-qdrant
    ports:
      - "127.0.0.1:6333:6333"   # REST, local development only
      - "127.0.0.1:6334:6334"   # gRPC, local development only
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  neo4j_data:
  qdrant_data:
