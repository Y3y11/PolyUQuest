x-app-environment: &app-environment
  APP_ENVIRONMENT: production
  APP_RUNTIME_PROFILE: ${BACKEND_RUNTIME_PROFILE:-remote}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set a non-default NEO4J_PASSWORD}
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  QWEN_API_KEY: ${QWEN_API_KEY:-}
  QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  GENERATION_MODEL: ${GENERATION_MODEL:-deepseek-v4-flash}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-siliconflow}
  SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
  SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?set the external application origin}
  CORS_ALLOW_CREDENTIALS: "true"
  AGENT_ALLOW_PERSISTENCE: "true"
  AGENT_LEDGER_PATH: /app/data/runtime/agent_ledger.sqlite3
  AGENT_ASYNC_INDEXING: "true"
  AGENT_RUN_STORE_PATH: /app/data/runtime/agent_runs.sqlite3
  AGENT_RUN_WORKER_POLL_SECONDS: ${AGENT_RUN_WORKER_POLL_SECONDS:-0.25}
  AGENT_RUN_LEASE_SECONDS: ${AGENT_RUN_LEASE_SECONDS:-120}
  AGENT_RUN_MAX_ATTEMPTS: ${AGENT_RUN_MAX_ATTEMPTS:-2}
  AGENT_RUN_RETRY_BASE_SECONDS: ${AGENT_RUN_RETRY_BASE_SECONDS:-2}
  AGENT_RUN_RETENTION_DAYS: ${AGENT_RUN_RETENTION_DAYS:-7}
  AGENT_RUN_EVENT_POLL_SECONDS: ${AGENT_RUN_EVENT_POLL_SECONDS:-0.25}
  AGENT_RUN_SSE_KEEPALIVE_SECONDS: ${AGENT_RUN_SSE_KEEPALIVE_SECONDS:-15}
  AGENT_RUN_QUEUE_WARN_SECONDS: ${AGENT_RUN_QUEUE_WARN_SECONDS:-30}
  AGENT_RUN_QUEUE_CRITICAL_SECONDS: ${AGENT_RUN_QUEUE_CRITICAL_SECONDS:-120}
  AGENT_RUN_ADMISSION_ENABLED: ${AGENT_RUN_ADMISSION_ENABLED:-true}
  AGENT_RUN_ADMISSION_MAX_ACTIVE: ${AGENT_RUN_ADMISSION_MAX_ACTIVE:-100}
  AGENT_RUN_ADMISSION_MAX_WAITING: ${AGENT_RUN_ADMISSION_MAX_WAITING:-80}
  AGENT_RUN_ADMISSION_RETRY_AFTER_SECONDS: ${AGENT_RUN_ADMISSION_RETRY_AFTER_SECONDS:-5}
  AGENT_RUN_ADMISSION_WARN_RATIO: ${AGENT_RUN_ADMISSION_WARN_RATIO:-0.8}
  AGENT_RUN_BUDGET_MAX_ITERATIONS: ${AGENT_RUN_BUDGET_MAX_ITERATIONS:-5}
  AGENT_RUN_BUDGET_MAX_PAGES: ${AGENT_RUN_BUDGET_MAX_PAGES:-10}
  AGENT_RUN_BUDGET_MAX_SECONDS: ${AGENT_RUN_BUDGET_MAX_SECONDS:-120}
  WORKER_SHUTDOWN_GRACE_SECONDS: ${WORKER_SHUTDOWN_GRACE_SECONDS:-30}

x-app-service: &app-service
  image: ${BACKEND_IMAGE:-polyuquest-backend:0.1.0}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      APP_RUNTIME_PROFILE: ${BACKEND_RUNTIME_PROFILE:-remote}
  init: true
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  stop_grace_period: 45s
  pids_limit: 512
  mem_limit: 6g
  cpus: 2.0
  networks:
    - backend
    - egress

services:
  api:
    <<: *app-service
    command: ["agent-rag-serve"]
    environment:
      <<: *app-environment
      APP_PROCESS_ROLE: api
      API_AUTH_MODE: api_key
      API_AUTH_KEYS: ${API_AUTH_KEYS:?set hash-only API_AUTH_KEYS}
      SECURITY_AUDIT_PATH: /app/data/runtime/security_audit.sqlite3
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_RELOAD: "false"
      AGENT_REPAIR_ON_STARTUP: "false"
      AGENT_RUN_WORKER_ENABLED: "false"
      INDEX_WORKER_ENABLED: "false"
      FRESHNESS_WORKER_ENABLED: "false"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - runtime_data:/app/data/runtime
      - cache_data:/app/data/cache
      - model_cache:/home/app/.cache
    depends_on:
      - neo4j
      - qdrant

  worker:
    <<: *app-service
    command: ["agent-rag-worker"]
    stop_grace_period: 75s
    environment:
      <<: *app-environment
      APP_PROCESS_ROLE: worker
      API_AUTH_MODE: disabled
      AGENT_REPAIR_ON_STARTUP: "true"
      AGENT_RUN_WORKER_ENABLED: "true"
      INDEX_WORKER_ENABLED: "true"
      FRESHNESS_WORKER_ENABLED: "true"
    volumes:
      - runtime_data:/app/data/runtime
      - cache_data:/app/data/cache
      - model_cache:/home/app/.cache
    depends_on:
      - neo4j
      - qdrant

  frontend:
    image: ${FRONTEND_IMAGE:-polyuquest-frontend:0.1.0}
    build:
      context: frontend
      dockerfile: Dockerfile
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    environment:
      BACKEND_API_URL: http://api:8000/api
      BFF_BACKEND_API_KEY_FILE: /run/secrets/bff_backend_api_key
      BFF_ALLOWED_ORIGINS: ${BFF_ALLOWED_ORIGINS:?set the external browser origin}
      BFF_MAX_REQUEST_BYTES: ${BFF_MAX_REQUEST_BYTES:-65536}
      BFF_UPSTREAM_TIMEOUT_SECONDS: ${BFF_UPSTREAM_TIMEOUT_SECONDS:-120}
    secrets:
      - bff_backend_api_key
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - frontend
      - backend
    depends_on:
      - api

  neo4j:
    image: neo4j:5.26.28
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set a non-default NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-2g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1g}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    stop_grace_period: 60s
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    networks:
      - backend

  backup:
    image: alpine:3.22.1
    profiles: ["ops"]
    network_mode: none
    environment:
      BACKUP_ID: ${BACKUP_ID:-manual}
    volumes:
      - type: bind
        source: ${BACKUP_ROOT:-./backups}
        target: /backups
      - type: volume
        source: neo4j_data
        target: /source/neo4j
        read_only: true
      - type: volume
        source: qdrant_data
        target: /source/qdrant
        read_only: true
      - type: volume
        source: runtime_data
        target: /source/runtime
        read_only: true
      - type: volume
        source: cache_data
        target: /source/cache
        read_only: true
    command:
      - /bin/sh
      - -ec
      - |
        case "$$BACKUP_ID" in *[!A-Za-z0-9._-]*|'') exit 64;; esac
        destination="/backups/$$BACKUP_ID"
        mkdir -p "$$destination"
        for volume in neo4j qdrant runtime cache; do
          tar -C "/source/$$volume" -czf "$$destination/$$volume.tgz" .
        done
        cd "$$destination"
        sha256sum neo4j.tgz qdrant.tgz runtime.tgz cache.tgz manifest.json > SHA256SUMS

  restore:
    image: alpine:3.22.1
    profiles: ["ops"]
    network_mode: none
    environment:
      BACKUP_ID: ${BACKUP_ID:-}
      CONFIRM_RESTORE: ${CONFIRM_RESTORE:-}
    volumes:
      - type: bind
        source: ${BACKUP_ROOT:-./backups}
        target: /backups
        read_only: true
      - type: volume
        source: neo4j_data
        target: /target/neo4j
      - type: volume
        source: qdrant_data
        target: /target/qdrant
      - type: volume
        source: runtime_data
        target: /target/runtime
      - type: volume
        source: cache_data
        target: /target/cache
    command:
      - /bin/sh
      - -ec
      - |
        test "$$CONFIRM_RESTORE" = "I_UNDERSTAND_DATA_WILL_BE_REPLACED"
        case "$$BACKUP_ID" in *[!A-Za-z0-9._-]*|'') exit 64;; esac
        source_dir="/backups/$$BACKUP_ID"
        cd "$$source_dir"
        sha256sum -c SHA256SUMS
        for volume in neo4j qdrant runtime cache; do
          find "/target/$$volume" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          tar -C "/target/$$volume" -xzf "$$source_dir/$$volume.tgz"
        done

  qdrant:
    image: qdrant/qdrant:v1.18.2
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    stop_grace_period: 60s
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    networks:
      - backend

networks:
  frontend:
  egress:
  backend:
    internal: true

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  runtime_data:
  cache_data:
  model_cache:

secrets:
  bff_backend_api_key:
    file: ${BFF_BACKEND_API_KEY_FILE:?set the host path to the raw reader key file}
