x-runtime-environment: &runtime-environment
  APP_ENVIRONMENT: test
  APP_RUNTIME_PROFILE: remote
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: topology_e2e_password
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  EMBEDDING_PROVIDER: siliconflow
  EMBEDDING_DIM: "64"
  LLM_PROVIDER: siliconflow
  RERANKER_MODE: first_stage_only
  AGENT_ALLOW_PERSISTENCE: "true"
  AGENT_ASYNC_INDEXING: "true"
  AGENT_LEDGER_PATH: /app/data/runtime/topology.sqlite3
  AGENT_RUN_STORE_PATH: /app/data/runtime/agent_runs.sqlite3
  AGENT_RUN_WORKER_POLL_SECONDS: "0.1"
  AGENT_RUN_QUEUE_WARN_SECONDS: "10"
  AGENT_RUN_QUEUE_CRITICAL_SECONDS: "60"
  AGENT_RUN_ADMISSION_ENABLED: "true"
  AGENT_RUN_ADMISSION_MAX_ACTIVE: "100"
  AGENT_RUN_ADMISSION_MAX_WAITING: "80"
  AGENT_RUN_ADMISSION_RETRY_AFTER_SECONDS: "5"
  AGENT_RUN_ADMISSION_WARN_RATIO: "0.8"
  AGENT_RUN_BUDGET_MAX_ITERATIONS: "5"
  AGENT_RUN_BUDGET_MAX_PAGES: "10"
  AGENT_RUN_BUDGET_MAX_SECONDS: "120"
  RUNTIME_METRICS_ENABLED: "true"
  RUNTIME_METRICS_CACHE_TTL_SECONDS: "5"
  RUNTIME_METRICS_TELEMETRY_WINDOW_HOURS: "24"
  RUNTIME_METRICS_WORKER_LIMIT: "100"
  OTEL_TRACING_MODE: propagate
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  SECURITY_AUDIT_PATH: /app/data/runtime/security.sqlite3
  BUSINESS_E2E_MODE: topology
  BUSINESS_E2E_TOKEN: ${TOPOLOGY_E2E_TOKEN:?set TOPOLOGY_E2E_TOKEN}
  BUSINESS_E2E_FIXTURE_ORIGIN: http://fixture:8080
  BUSINESS_E2E_CLAIM_MARKER: /app/data/runtime/topology-claim-delay.done
  WORKER_HEARTBEAT_SECONDS: "0.5"
  WORKER_HEARTBEAT_MAX_AGE_SECONDS: "2.0"
  CORS_ALLOW_ORIGINS: http://127.0.0.1:${TOPOLOGY_API_PORT:-18000}
  CORS_ALLOW_CREDENTIALS: "true"

x-app-service: &app-service
  image: ${TOPOLOGY_BACKEND_IMAGE:-polyuquest-topology-e2e:local}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      APP_RUNTIME_PROFILE: remote
  init: true
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: "no"
  networks:
    - backend
    - fixture_net

services:
  api:
    <<: *app-service
    command: ["agent-rag-serve"]
    environment:
      <<: *runtime-environment
      APP_PROCESS_ROLE: api
      OTEL_SERVICE_NAME: polyuquest-api
      API_AUTH_MODE: api_key
      API_AUTH_KEYS: ${TOPOLOGY_API_AUTH_KEYS:?set hash-only TOPOLOGY_API_AUTH_KEYS}
      END_USER_IDENTITY_MODE: signed_jwt
      END_USER_IDENTITY_SECRET_FILE: /run/secrets/topology_internal_identity_secret
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_RELOAD: "false"
      AGENT_REPAIR_ON_STARTUP: "false"
      AGENT_RUN_WORKER_ENABLED: "false"
      INDEX_WORKER_ENABLED: "false"
      FRESHNESS_WORKER_ENABLED: "false"
    ports:
      - "127.0.0.1:${TOPOLOGY_API_PORT:-18000}:8000"
    volumes:
      - topology_runtime:/app/data/runtime
      - topology_cache:/app/data/cache
    secrets:
      - topology_internal_identity_secret
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
      fixture:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)
      interval: 2s
      timeout: 5s
      start_period: 20s
      retries: 60

  worker:
    <<: *app-service
    command: ["agent-rag-worker"]
    environment:
      <<: *runtime-environment
      APP_PROCESS_ROLE: worker
      OTEL_SERVICE_NAME: polyuquest-worker
      API_AUTH_MODE: disabled
      AGENT_REPAIR_ON_STARTUP: "true"
      AGENT_RUN_WORKER_ENABLED: "true"
      AGENT_RUN_LEASE_SECONDS: "2"
      AGENT_RUN_MAX_ATTEMPTS: "2"
      AGENT_RUN_RETRY_BASE_SECONDS: "0"
      INDEX_WORKER_ENABLED: "true"
      FRESHNESS_WORKER_ENABLED: "true"
      INDEX_WORKER_POLL_SECONDS: "0.1"
      INDEX_WORKER_LEASE_SECONDS: "2"
      INDEX_JOB_RETRY_BASE_SECONDS: "0"
      INDEX_JOB_RETRY_MAX_SECONDS: "0"
      FRESHNESS_WORKER_POLL_SECONDS: "0.2"
      FRESHNESS_WORKER_LEASE_SECONDS: "2"
      WORKER_SHUTDOWN_GRACE_SECONDS: "5"
      BUSINESS_E2E_CLAIM_DELAY_SECONDS: "20"
      BUSINESS_E2E_AGENT_RUN_DELAY_SECONDS: "20"
    volumes:
      - topology_runtime:/app/data/runtime
      - topology_cache:/app/data/cache
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
      fixture:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "agent-rag-worker-health", "--max-age-seconds", "2"]
      interval: 1s
      timeout: 3s
      start_period: 10s
      retries: 10

  frontend:
    image: ${TOPOLOGY_FRONTEND_IMAGE:-polyuquest-topology-frontend:local}
    build:
      context: frontend
      dockerfile: Dockerfile
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    environment:
      BACKEND_API_URL: http://api:8000/api
      BFF_BACKEND_API_KEY_FILE: /run/secrets/topology_bff_api_key
      BFF_IDENTITY_MODE: signed_jwt
      BFF_GATEWAY_IDENTITY_SECRET_FILE: /run/secrets/topology_gateway_identity_secret
      BFF_INTERNAL_IDENTITY_SECRET_FILE: /run/secrets/topology_internal_identity_secret
      BFF_ALLOWED_ORIGINS: ${TOPOLOGY_BROWSER_ORIGIN:-http://127.0.0.1:13000}
      BFF_MAX_REQUEST_BYTES: "65536"
      BFF_UPSTREAM_TIMEOUT_SECONDS: "120"
    secrets:
      - topology_bff_api_key
      - topology_gateway_identity_secret
      - topology_internal_identity_secret
    ports:
      - "127.0.0.1:${TOPOLOGY_FRONTEND_PORT:-13000}:3000"
    networks:
      - backend
      - fixture_net
    depends_on:
      api:
        condition: service_healthy

  fixture:
    <<: *app-service
    command: ["agent-rag-e2e-fixture"]
    environment:
      <<: *runtime-environment
      APP_PROCESS_ROLE: api
      API_AUTH_MODE: disabled
      AGENT_RUN_WORKER_ENABLED: "false"
      INDEX_WORKER_ENABLED: "false"
      FRESHNESS_WORKER_ENABLED: "false"
      FIXTURE_PORT: "8080"
    ports:
      - "127.0.0.1:${TOPOLOGY_FIXTURE_PORT:-18080}:8080"
    volumes: []
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/__control/health', timeout=3)
      interval: 1s
      timeout: 3s
      start_period: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26.28
    environment:
      NEO4J_AUTH: neo4j/topology_e2e_password
    volumes:
      - topology_neo4j_data:/data
      - topology_neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u neo4j -p topology_e2e_password
          "RETURN 1" >/dev/null 2>&1
      interval: 3s
      timeout: 5s
      retries: 40
    restart: "no"
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:v1.18.2
    tmpfs:
      - /qdrant/storage:size=512m
    restart: "no"
    networks:
      - backend

networks:
  backend:
    internal: true
  fixture_net:

volumes:
  topology_runtime:
  topology_cache:
  topology_neo4j_data:
  topology_neo4j_logs:

secrets:
  topology_bff_api_key:
    file: ${TOPOLOGY_BFF_API_KEY_FILE:?set TOPOLOGY_BFF_API_KEY_FILE}
  topology_gateway_identity_secret:
    file: ${TOPOLOGY_GATEWAY_IDENTITY_SECRET_FILE:?set TOPOLOGY_GATEWAY_IDENTITY_SECRET_FILE}
  topology_internal_identity_secret:
    file: ${TOPOLOGY_INTERNAL_IDENTITY_SECRET_FILE:?set TOPOLOGY_INTERNAL_IDENTITY_SECRET_FILE}
